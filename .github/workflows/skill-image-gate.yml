name: Skill image gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild bundled Skills
        run: node mcp-server/build-skills.mjs

      - name: Verify generated bundle is committed
        run: git diff --exit-code -- mcp-server/src/skills-data.json

      - name: Run MCP and Skill image tests
        run: node mcp-server/test.mjs
